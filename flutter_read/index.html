<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万源阅读 - 协议与政策中心 | Flutter Read Legal Portal</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      --accent: #0D9488;
      --accent-hover: #0F766E;
      --accent-soft: #F0FDFA;
      --accent-border: #CCFBF1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0F19;
        --card-bg: #141B2D;
        --text-main: #F1F5F9;
        --text-sub: #94A3B8;
        --border: rgba(255, 255, 255, 0.1);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --accent: #2DD4BF;
        --accent-hover: #14B8A6;
        --accent-soft: rgba(45, 212, 191, 0.12);
        --accent-border: rgba(45, 212, 191, 0.25);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0D9488, #0284C7);
      border-radius: 14px;
      font-size: 24px;
      color: #FFFFFF;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    h1 {
      font-size: 1.45rem;
      color: var(--text-main);
      margin: 0 0 6px 0;
      font-weight: 700;
    }

    p.desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      margin: 0 0 28px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 14px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    a:hover {
      background: #0D9488;
      color: #FFFFFF;
      border-color: #0D9488;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
    }

    .tag {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center;">
      <div class="badge">阅</div>
      <h1>万源阅读 · 书源与阅读工具</h1>
      <p class="desc">法律条款、合规声明与隐私保护政策</p>
    </div>

    <ul>
      <li>
        <a href="privacy.html">
          <span>🔒 隐私保护政策</span>
          <span class="tag">Privacy Policy &rarr;</span>
        </a>
      </li>
      <li>
        <a href="terms.html">
          <span>📄 用户服务协议</span>
          <span class="tag">Terms of Service &rarr;</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
