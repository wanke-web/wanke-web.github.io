<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律条款与协议中心 | Legal Documents Portal</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-hint: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0F19;
        --card-bg: #141B2D;
        --text-main: #F1F5F9;
        --text-sub: #94A3B8;
        --text-hint: #64748B;
        --border: rgba(255, 255, 255, 0.1);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--text-main);
      margin: 0 0 6px 0;
      text-align: center;
      font-weight: 700;
    }

    .desc {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin: 0 0 28px 0;
    }

    .section-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F0FDF4;
      color: #0F766E;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #CCFBF1;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.2s;
    }

    @media (prefers-color-scheme: dark) {
      a {
        background: rgba(15, 118, 110, 0.15);
        color: #2DD4BF;
        border-color: rgba(45, 212, 191, 0.25);
      }
    }

    a:hover {
      background: #0F766E;
      color: #FFFFFF;
      border-color: #0F766E;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .tag {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: normal;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-hint);
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📜 应用法律与隐私合规中心</h1>
    <p class="desc">App Terms of Service & Privacy Policy Directory</p>

    <div class="section-title">📖 万源阅读 (Flutter Read)</div>
    <ul>
      <li>
        <a href="/flutter_read/privacy.html">
          <span>🔒 隐私保护政策</span>
          <span class="tag">Privacy Policy &rarr;</span>
        </a>
      </li>
      <li>
        <a href="/flutter_read/terms.html">
          <span>📋 用户服务协议</span>
          <span class="tag">Terms of Service &rarr;</span>
        </a>
      </li>
    </ul>

    <footer>
      &copy; 2026 Legal & Compliance Portal. All rights reserved.
    </footer>
  </div>
</body>
</html>
